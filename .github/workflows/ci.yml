name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: code

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: code/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked Python dependencies
        working-directory: ${{ github.workspace }}
        run: python -m pip install --requirement requirements.lock

      - name: Verify Python dependency imports
        working-directory: ${{ github.workspace }}
        run: |
          python -c 'import huggingface_hub; print(huggingface_hub.__version__)'
          python -c 'import tokenizers; print(tokenizers.__version__)'
          python -c 'import transformers; print(transformers.__version__)'
          python -c 'import torch; print(torch.__version__)'
          python -c 'import fastembed; print(fastembed.__version__)'
          python -m pip check

      - name: Install locked dependencies
        run: npm ci

      - name: Install and verify the supported Codex CLI
        run: |
          npm install --global @openai/codex@0.146.0
          codex --version | grep -F '0.146.0'

      - name: Run type, unit, and offline smoke tests
        run: npm run check

      - name: Check public entry points
        run: |
          npm run run:retrieval -- --help
          npm run run:rag -- --help
          python3 tools/deep_ce_rerank.py --help

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check shell scripts
        run: bash -n scripts/*.sh

      - name: Compile Python sources
        run: python3 -m compileall -q tools ../sidecar/src ../sidecar/config.py
